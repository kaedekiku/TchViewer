<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TchViewer オーバーレイ</title>
<style>
  /* 既定値。レイアウトの設定（下の #look）→ レイアウトの追加CSS（#userCss）→ OBS のカスタムCSS の順に上書きされる。
     使えるクラス: .msg（1件）/ .board .twitch / .s-5ch .shitaraba .jpnkn / .badge .meta .no .name .uid .text / img.emote(.giant) */
  :root {
    --gap: 6px;
    --ow: 0px;            /* 縁取りの太さ */
    --oc: #000;           /* 縁取りの色 */
    --c-twitch: #9147ff;
    --c-5ch: #e05a2b;
    --c-shitaraba: #2f8f4e;
    --c-jpnkn: #2a7bd6;
    /* 掲示板 */
    --b-font: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    --b-size: 22px; --b-meta: .72; --b-fg: #fff; --b-name: #fff; --b-id: #d0d0d0; --b-bg: rgba(0, 0, 0, .55);
    /* Twitch */
    --t-font: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    --t-size: 22px; --t-meta: .72; --t-fg: #fff; --t-name: #bf94ff; --t-bg: rgba(0, 0, 0, .55);
    --t-emote: 32px; --t-giant: 112px; --t-badge: 18px;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
  #list { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: var(--gap); padding: 8px; }
  .top #list { top: 0; bottom: auto; flex-direction: column-reverse; }
  .msg { display: flex; gap: .5em; align-items: flex-start; border-left: 5px solid var(--accent); border-radius: 6px; padding: .35em .6em; animation: in .25s ease-out; line-height: 1.35; }
  .msg.board { font-family: var(--b-font); font-size: var(--b-size); color: var(--b-fg); background: var(--b-bg); }
  .msg.twitch { font-family: var(--t-font); font-size: var(--t-size); color: var(--t-fg); background: var(--t-bg); }
  .msg.out { transition: opacity .6s; opacity: 0; }
  .meta, .text { -webkit-text-stroke: var(--ow) var(--oc); paint-order: stroke fill; }
  .badge { flex: none; font-size: .62em; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: .15em .45em; margin-top: .25em; }
  .body { min-width: 0; }
  .board .meta { font-size: calc(var(--b-meta) * 1em); }
  .twitch .meta { font-size: calc(var(--t-meta) * 1em); }
  .name { font-weight: 700; }
  .board .name { color: var(--b-name); }
  .twitch .name { color: var(--t-name); }
  .board .uid { color: var(--b-id); }
  .no { margin-right: .4em; opacity: .85; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .text img.emote { height: var(--t-emote); vertical-align: middle; }
  .text img.emote.giant { height: var(--t-giant); display: inline-block; }
  .twitch { --accent: var(--c-twitch); }
  .s-5ch { --accent: var(--c-5ch); }
  .shitaraba { --accent: var(--c-shitaraba); }
  .jpnkn { --accent: var(--c-jpnkn); }
  /* 表示／非表示と名前色は body のクラスで切り替える（表示済みのコメントにもすぐ反映される） */
  .b-hide-site .board .badge, .b-hide-no .board .no, .b-hide-name .board .name, .b-hide-id .board .uid,
  .b-hide-no.b-hide-name.b-hide-id .board .meta,
  .t-hide-site .twitch .badge, .t-hide-name .twitch .meta { display: none; }
  .t-user-color .twitch .name.uc { color: var(--uc); }
  .badges { display: inline-flex; gap: .2em; margin-right: .3em; vertical-align: middle; }
  .badges img { height: var(--t-badge); width: auto; }
  .t-hide-badges .badges { display: none; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
<style id="look"></style>
<link id="userCss" rel="stylesheet" href="">
</head>
<body>
<div id="list"></div>
<script>
// URLパラメータ: layout=レイアウト名（無指定は「標準」）
// 以下は設定より優先: max=表示件数, fade=消えるまでの秒数(0=消さない), size=文字px(掲示板・Twitch共通),
// top=1 新しいものを上に, hide=twitch,5ch,shitaraba,jpnkn 非表示, history=再読込時の過去件数
const q = new URLSearchParams(location.search);
const HIDE = new Set((q.get('hide') || '').split(',').filter(Boolean));
const list = document.getElementById('list');
let layoutName = q.get('layout') || '';
let look = {};             // 現在の見た目設定
let boot = 0, lastId = 0;  // 再接続時の重複表示防止

// ---- 設定値の検証（外部から来た値として扱う。CSS に入れるので形式を厳しく確かめる）
const color = (v, d) => (/^#[0-9a-f]{6}$/i.test(v || '') ? v : d);
const num = (v, d, lo, hi) => (v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v)) ? Math.min(hi, Math.max(lo, Number(v))) : d);
const rgba = (hex, a) => { const c = color(hex, '#000000'); return `rgba(${parseInt(c.slice(1, 3), 16)},${parseInt(c.slice(3, 5), 16)},${parseInt(c.slice(5, 7), 16)},${num(a, 0.55, 0, 1)})`; };
const font = (v) => {
  const name = String(v || '').replace(/["'\;{}<>\r\n]/g, '').trim().slice(0, 100);
  const base = '"BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif';
  return name ? `"${name}", ${base}` : base;
};

function applyLook(a) {
  look = a || {};
  const b = look.board || {}, t = look.twitch || {};
  const size = q.get('size');
  const vars = {
    '--gap': `${num(look.gap, 6, 0, 60)}px`,
    '--ow': `${num(look.outlineWidth, 0, 0, 8)}px`,
    '--oc': color(look.outlineColor, '#000000'),
    '--b-font': font(b.fontFamily),
    '--b-size': `${num(size ?? b.fontSize, 22, 8, 120)}px`,
    '--b-meta': num(b.metaScale, 72, 30, 150) / 100,
    '--b-fg': color(b.textColor, '#ffffff'),
    '--b-name': color(b.nameColor, '#ffffff'),
    '--b-id': color(b.idColor, '#d0d0d0'),
    '--b-bg': rgba(b.bgColor, b.bgOpacity ?? 0.55),
    '--t-font': font(t.fontFamily),
    '--t-size': `${num(size ?? t.fontSize, 22, 8, 120)}px`,
    '--t-meta': num(t.metaScale, 72, 30, 150) / 100,
    '--t-fg': color(t.textColor, '#ffffff'),
    '--t-name': color(t.nameColor, '#bf94ff'),
    '--t-bg': rgba(t.bgColor, t.bgOpacity ?? 0.55),
    '--t-emote': `${num(t.emoteSize, 32, 8, 200)}px`,
    '--t-giant': `${num(t.giantEmoteSize, 112, 16, 600)}px`,
    '--t-badge': `${num(t.badgeSize, 18, 8, 120)}px`,
  };
  // ページへの直接の書き込みではなくスタイルとして入れる（追加CSS・OBSのカスタムCSSで !important なしに上書きできる）
  document.getElementById('look').textContent = `:root{${Object.entries(vars).map(([k, v]) => `${k}:${v};`).join('')}}`;
  const top = q.has('top') ? q.get('top') === '1' : !!look.newestOnTop;
  const cl = document.body.classList;
  cl.toggle('top', top);
  cl.toggle('b-hide-site', b.showSite === false);
  cl.toggle('b-hide-no', b.showNo === false);
  cl.toggle('b-hide-name', b.showName === false);
  cl.toggle('b-hide-id', b.showId === false);
  cl.toggle('t-hide-site', t.showSite === false);
  cl.toggle('t-hide-name', t.showName === false);
  cl.toggle('t-user-color', t.useUserColor !== false);
  cl.toggle('t-hide-badges', t.showBadges === false);
  recolorNames();
  trim();
}
function loadUserCss() {
  document.getElementById('userCss').href = `/layout.css?layout=${encodeURIComponent(layoutName)}&t=${Date.now()}`;
}
const maxItems = () => num(q.get('max') ?? look.maxItems, 15, 1, 200);
const fadeSeconds = () => num(q.get('fade') ?? look.fadeSeconds, 0, 0, 3600);
function trim() { while (list.children.length > maxItems()) list.firstElementChild.remove(); }


// ---- 読みにくい色の自動調整（背景との見やすさの比率が 4.5:1 未満の色だけ、色合いを保って明るさを変える）
function hexRgb(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); }
function luminance(rgb) {
  const [r, g, b] = rgb.map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); }
function rgbHsl([r, g, b]) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslRgb([h, s, l]) {
  if (s === 0) return [l, l, l];
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3), f(h), f(h - 1 / 3)];
}
function readableColor(hex, bgHex, min = 4.5) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || '') || !/^#[0-9a-f]{6}$/i.test(bgHex || '')) return hex;
  const bg = hexRgb(bgHex);
  let rgb = hexRgb(hex);
  if (contrast(rgb, bg) >= min) return hex;
  const hsl = rgbHsl(rgb);
  const up = luminance(bg) < 0.4; // 暗い背景なら明るく、明るい背景なら暗くする
  for (let i = 0; i < 50 && contrast(rgb, bg) < min; i++) {
    hsl[2] = Math.min(1, Math.max(0, hsl[2] + (up ? 0.02 : -0.02)));
    rgb = hslRgb(hsl);
  }
  return '#' + rgb.map((c) => Math.round(c * 255).toString(16).padStart(2, '0')).join('');
}

// 名前の色（視聴者の色）を、設定に応じて背景色に対して読みやすく調整する
function nameColor(c) {
  const t = look.twitch || {};
  return t.fixNameContrast ? readableColor(c, color(t.bgColor, '#000000')) : c;
}
function recolorNames() {
  for (const n of document.querySelectorAll('.twitch .name[data-c]')) n.style.setProperty('--uc', nameColor(n.dataset.c));
}

// ---- 描画（外部から来た文字列は innerHTML に入れず textContent / 属性で組み立てる）
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}

function renderText(m) {
  const box = el('div', 'text');
  if (m.source !== 'twitch' || !Array.isArray(m.emotes) || !m.emotes.length) {
    box.textContent = m.text;
    return box;
  }
  const cps = Array.from(m.text); // Twitchのエモート位置はコードポイント単位
  let pos = 0;
  m.emotes.forEach((e, i) => {
    if (!/^[\w-]+$/.test(e.id) || e.start < pos) return;
    // パワーアップで巨大化されるのはメッセージ内の最後のスタンプ
    const giant = m.giant && i === m.emotes.length - 1;
    box.append(cps.slice(pos, e.start).join(''));
    const img = el('img', giant ? 'emote giant' : 'emote');
    img.alt = cps.slice(e.start, e.end + 1).join('');
    img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(e.id)}/default/dark/${giant ? '3.0' : '2.0'}`;
    box.append(img);
    pos = e.end + 1;
  });
  box.append(cps.slice(pos).join(''));
  return box;
}

// バッジ（画像アドレスは Twitch の画像配信サーバーのものだけ使う。サイズ設定に合わせて解像度を選ぶ）
function renderBadges(list) {
  const box = el('span', 'badges');
  const scale = num(look.twitch?.badgeSize, 18, 8, 120) > 36 ? 3 : 2;
  for (const b of list) {
    if (typeof b.url !== 'string' || !/^https:\/\/static-cdn\.jtvnw\.net\/badges\/v1\/[0-9a-f-]+$/i.test(b.url)) continue;
    const img = el('img');
    img.src = `${b.url}/${scale}`;
    img.alt = img.title = String(b.title || '');
    box.append(img);
  }
  return box;
}

function add(m) {
  if (m.boot !== boot) { boot = m.boot; lastId = 0; }
  if (HIDE.has(m.source) || m.id <= lastId) return;
  lastId = m.id;
  const tw = m.source === 'twitch';
  const row = el('div', `msg ${tw ? 'twitch' : 'board'} ${m.source === '5ch' ? 's-5ch' : m.source}`);
  const meta = el('div', 'meta');
  if (m.no) meta.append(el('span', 'no', m.no));
  if (tw && Array.isArray(m.badgeList) && m.badgeList.length) meta.append(renderBadges(m.badgeList));
  const name = el('span', 'name', m.name);
  if (tw && /^#[0-9a-f]{6}$/i.test(m.color || '')) { name.classList.add('uc'); name.dataset.c = m.color; name.style.setProperty('--uc', nameColor(m.color)); }
  meta.append(name);
  if (m.uid) meta.append(' ', el('span', 'uid', `ID:${m.uid}`));
  const body = el('div', 'body');
  body.append(meta, renderText(m));
  row.append(el('span', 'badge', m.site), body);
  list.appendChild(row);
  trim();
  const fade = fadeSeconds();
  if (fade > 0) setTimeout(() => { row.classList.add('out'); setTimeout(() => row.remove(), 700); }, fade * 1000);
}

// ---- 受信（WebSocket。切れたら少し待って自動で再接続）
let retry = 0;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?history=${num(q.get('history') ?? maxItems(), 15, 0, 200)}`);
  ws.onopen = () => { retry = 0; };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'comment') add(m);
    else if (m.type === 'appearance' && m.layout === layoutName) applyLook(m.appearance);
    else if (m.type === 'layout_css' && m.layout === layoutName) loadUserCss();
  };
  ws.onclose = () => { retry = Math.min(retry + 1, 5); setTimeout(connect, retry * 1000); };
}

fetch(`/api/appearance?layout=${encodeURIComponent(layoutName)}`).then((r) => r.json())
  .then((r) => { layoutName = r.layout; applyLook(r.appearance); })
  .catch(() => applyLook({}))
  .finally(() => { loadUserCss(); connect(); });
</script>
</body>
</html>
